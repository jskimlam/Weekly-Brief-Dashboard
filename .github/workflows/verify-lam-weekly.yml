name: LAM Weekly Price Crosscheck (G2)

on:
  push:
    branches: [main]
    paths:
      - 'data/w42-20261016.json'
      - '.github/workflows/verify-lam-weekly.yml'
  pull_request:
    paths:
      - 'data/w42-20261016.json'
      - '.github/workflows/verify-lam-weekly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosscheck-w42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch canonical 18-item ledger, weekly report, AS and validation script
        run: |
          set -e
          RAW=https://raw.githubusercontent.com/jskimlam/Petrochemical-Weekly-Board/main
          mkdir -p /tmp/petrocheck/data/verification /tmp/petrocheck/data/weekly /tmp/petrocheck/data/as /tmp/petrocheck/scripts
          curl -fLsS --retry 3 "$RAW/data/verification/W42.json" -o /tmp/petrocheck/data/verification/W42.json
          curl -fLsS --retry 3 "$RAW/data/weekly/W42.md" -o /tmp/petrocheck/data/weekly/W42.md
          curl -fLsS --retry 3 "$RAW/data/as/W42.md" -o /tmp/petrocheck/data/as/W42.md
          curl -fLsS --retry 3 "$RAW/scripts/verify-weekly-crosscheck.cjs" -o /tmp/petrocheck/scripts/verify-weekly-crosscheck.cjs
      - name: Verify LAM prices and wording against approved ledger
        run: node /tmp/petrocheck/scripts/verify-weekly-crosscheck.cjs --lam=data/w42-20261016.json --self-test
