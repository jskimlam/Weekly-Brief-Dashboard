name: Build LAM Weekly APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-lam-weekly-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode branding assets
        run: |
          mkdir -p android-app/app/src/main/res/drawable
          base64 -d android-app/assets/icon_base64.txt > android-app/app/src/main/res/drawable/lam_weekly_icon.jpg
          base64 -d android-app/assets/splash_base64.txt > android-app/app/src/main/res/drawable/lam_weekly_splash.jpg
          file android-app/app/src/main/res/drawable/lam_weekly_icon.jpg
          file android-app/app/src/main/res/drawable/lam_weekly_splash.jpg

      - name: Build release APK
        working-directory: android-app
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare artifact
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk LAM-Weekly-1.0.0.apk
          sha256sum LAM-Weekly-1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAM-Weekly-APK
          path: LAM-Weekly-1.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view lam-weekly-v1.0.0 >/dev/null 2>&1; then
            gh release upload lam-weekly-v1.0.0 LAM-Weekly-1.0.0.apk --clobber
          else
            gh release create lam-weekly-v1.0.0 LAM-Weekly-1.0.0.apk \
              --title "LAM Weekly 1.0.0" \
              --notes "LAM Weekly 6 Key Feedstocks Android APK. WebView shell for the live Weekly-Brief-Dashboard with Fold-responsive UI, native PNG/PDF saving, LAM Weekly launcher icon and branded splash screen."
          fi
